# AeternaVault application catalog
#
# Describes where applications keep their settings, so they can be backed up
# and restored to the right place on another computer.
#
# To add or override entries without rebuilding, create `apps.toml` next to
# `config.toml` with the same format. Entries with the same `id` replace the
# built-in ones.
#
# Path tokens: {USERPROFILE} {APPDATA} {LOCALAPPDATA} {LOCALLOW} {DOCUMENTS}
#              {PICTURES} {MUSIC} {VIDEOS} {DESKTOP} {DOWNLOADS} {SAVEDGAMES}
#              {PROGRAMFILES} {PROGRAMFILESX86}
#
# Fields:
#   id, name, name_de (optional), category, default (pre-selected, default true)
#   processes  executables that should be closed for a consistent copy
#   note_en / note_de  short hint shown in the app (optional)
#   [[app.folder]] path, label (sub-folder in the backup), exclude (patterns),
#                  only (relative paths; if set, nothing else is taken)
#   registry   HKCU keys (other hives are not supported)
#
# Categories: browsers, email, communication, office, development, media,
#             gaming, security, utilities, windows

# ---------------------------------------------------------------- browsers

[[app]]
id = "firefox"
name = "Firefox"
category = "browsers"
processes = ["firefox.exe"]
note_en = "Bookmarks, passwords, extensions and settings of all profiles."
note_de = "Lesezeichen, Passwörter, Erweiterungen und Einstellungen aller Profile."
[[app.folder]]
path = '{APPDATA}\Mozilla\Firefox'
exclude = ["Crash Reports", "Pending Pings", "datareporting", "saved-telemetry-pings", "crashes", "minidumps", "parent.lock", "cache2", "startupCache", "shader-cache"]

[[app]]
