# ---------------------------------------------------------------- email

[[app]]
id = "thunderbird"
name = "Thunderbird"
category = "email"
note_en = "All mail, accounts, address books and settings. Saved passwords and sign-ins are left out; enter them again after restoring. Close Thunderbird before backing up."
note_de = "Alle E-Mails, Konten, Adressbücher und Einstellungen. Gespeicherte Passwörter und Anmeldungen werden nicht gesichert; nach dem Wiederherstellen neu eingeben. Thunderbird vor dem Sichern schließen."
windows = ['{APPDATA}\Thunderbird']
linux = ['{HOME}/.thunderbird', '{HOME}/snap/thunderbird/common/.thunderbird']
exclude = ["cookies.sqlite*", "logins.json", "logins-backup.json", "key4.db", "signedInUser.json", "cache2", "startupCache", "Crash Reports", "Pending Pings", "crashes", "minidumps", "datareporting", "saved-telemetry-pings", "parent.lock", "lock", ".parentlock"]
sensitive = true

[[app]]
id = "outlook-data"
name = "Outlook data files (PST)"
name_de = "Outlook-Datendateien (PST)"
category = "email"
note_en = "Archives and mailboxes stored in PST files. OST files are only a copy of the mail account and are left out. Close Outlook before backing up."
note_de = "Archive und Postfächer in PST-Dateien. OST-Dateien sind nur eine Kopie des Kontos und werden ausgelassen. Outlook vor dem Sichern schließen."
windows = ['{DOCUMENTS}\Outlook Files', '{DOCUMENTS}\Outlook-Dateien']
exclude = ["*.ost"]
sensitive = true

[[app]]
id = "outlook-signatures"
name = "Outlook signatures"
name_de = "Outlook-Signaturen"
category = "email"
windows = ['{APPDATA}\Microsoft\Signatures']

