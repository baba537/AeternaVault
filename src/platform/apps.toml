# AeternaVault application catalog
#
# Applications whose data is worth keeping, and the folders it lives in. An
# application is offered only if one of its folders exists on the computer.
# Choosing it adds the folder to the folders to back up.
#
# To add or override entries without rebuilding, create `apps.toml` next to
# `config.toml` with the same format. Entries with the same `id` replace the
# built-in ones.
#
# Path tokens
#   Windows: {USERPROFILE} {APPDATA} {LOCALAPPDATA} {DOCUMENTS} {SAVEDGAMES}
#            {PROGRAMFILES} {PROGRAMFILESX86}
#   Linux:   {HOME} {CONFIG} (~/.config) {DATA} (~/.local/share) {DOCUMENTS}
#
# Sign-ins (cookies, tokens) and saved passwords are always excluded.
#
# Fields: id, name, name_de, category, note_en, note_de, windows, linux,
#         exclude (patterns), sensitive (suggest encryption)
# Categories: browsers, email, documents, development, gaming, media

# ---------------------------------------------------------------- browsers

[[app]]
id = "firefox"
name = "Firefox"
category = "browsers"
note_en = "Bookmarks, history, extensions and settings of all profiles. Sign-ins and saved passwords are left out. Close Firefox before backing up."
note_de = "Lesezeichen, Verlauf, Erweiterungen und Einstellungen aller Profile. Anmeldungen und gespeicherte Passwörter werden nicht gesichert. Firefox vor dem Sichern schließen."
windows = ['{APPDATA}\Mozilla\Firefox']
linux = ['{HOME}/.mozilla/firefox', '{HOME}/snap/firefox/common/.mozilla/firefox', '{HOME}/.var/app/org.mozilla.firefox/.mozilla/firefox']
exclude = ["cookies.sqlite*", "logins.json", "logins-backup.json", "key4.db", "signedInUser.json", "cache2", "startupCache", "shader-cache", "Crash Reports", "Pending Pings", "crashes", "minidumps", "datareporting", "saved-telemetry-pings", "parent.lock", "lock", ".parentlock"]
sensitive = true

