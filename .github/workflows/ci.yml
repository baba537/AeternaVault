name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint, test, build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # rustup is preinstalled on GitHub's Windows runners.
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

      - name: Release build
        run: cargo build --release --locked

      # Same SBOM step as in the release, so a broken tool shows up before tagging.
      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx

      - name: SBOM
        shell: pwsh
        run: |
          cargo cyclonedx --format json
          if (-not (Get-ChildItem -Filter *.cdx.json)) { throw "no SBOM was written" }

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: AeternaVault-${{ github.sha }}
          path: target/release/AeternaVault.exe
          retention-days: 14
